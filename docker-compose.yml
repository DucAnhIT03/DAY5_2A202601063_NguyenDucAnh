services:
  mongodb:
    image: mongo:8.0
    container_name: catchup-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27020:27017"
    volumes:
      - catchup_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  catchup_mongodb_data:
    name: catchup_mongodb_data
