[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#F7F8FC"
secondaryBackgroundColor = "#EEF2FF"
codeBackgroundColor = "#F1F5F9"
textColor = "#182033"
linkColor = "#4338CA"
borderColor = "#E1E5EE"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "12px"
buttonRadius = "10px"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap"
baseFontSize = 15
headingFontSizes = ["36px", "27px", "21px", "17px", "15px", "13px"]
headingFontWeights = [800, 700, 700, 650, 600, 600]
linkUnderline = false
blueColor = "#4F46E5"
greenColor = "#059669"
orangeColor = "#D97706"
redColor = "#DC2626"
grayColor = "#64748B"

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F5FB"
textColor = "#182033"
borderColor = "#E1E5EE"
primaryColor = "#4F46E5"

[client]
toolbarMode = "minimal"
